[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csa-manager"
version = "0.1.0"
description = "Institutional CSA, collateral valuation and optimization workbench."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.2.3",
  "streamlit==1.59.1",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
